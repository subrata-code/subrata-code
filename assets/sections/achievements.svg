<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img">
<defs>
  <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070d"/>
    <stop offset="45%" stop-color="#0a1428"/>
    <stop offset="100%" stop-color="#0c1834"/>
  </linearGradient>
  <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#34d399"/>
  </linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#67e8f9"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="pGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22d3ee" stroke-width="0.45"/>
  </pattern>
</defs>
<style>
  .t { font-family: Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
  .pulse { animation: pulse 4s ease-in-out infinite; }
  .tw { animation: tw 3.2s ease-in-out infinite; }
  .glow { animation: glow 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.6 } 50% { opacity:1 } }
  @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px rgba(34,211,238,0.3)) } 50% { filter: drop-shadow(0 0 8px rgba(34,211,238,0.6)) } }
</style>

<rect width="1100" height="240" rx="16" fill="#05070d"/>
<rect x="1" y="1" width="1098" height="238" rx="15" fill="#070e1a" stroke="#1a2a48"/>
<text class="m" x="28" y="36" fill="#22d3ee" font-size="11" letter-spacing="3">ACHIEVEMENT CONSOLE</text>
<text class="t" x="28" y="60" fill="#8b9cc8" font-size="12">Real milestones. Every slot earned.</text>

<!-- ACHIEVEMENT 1 — HACKTOBERFEST -->
<g transform="translate(28 78)">
  <rect width="248" height="130" rx="10" fill="#0c1628" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <rect width="248" height="3" rx="1.5" fill="url(#gGold)" opacity="0.6"/>
  <!-- Trophy icon -->
  <g transform="translate(16, 24)">
    <path d="M8 0 L18 0 L16 12 Q13 16 13 18 L8 18 Q8 16 5 12 Z" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.8"/>
    <rect x="7" y="18" width="12" height="2" rx="1" fill="#f59e0b" opacity="0.6"/>
    <path d="M18 2 Q24 4 22 10 L16 8" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
    <path d="M8 2 Q2 4 4 10 L10 8" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  </g>
  <text class="m" x="46" y="40" fill="#f59e0b" font-size="9" letter-spacing="1.6">OPEN SOURCE</text>
  <text class="t" x="16" y="76" fill="#e8eefc" font-size="13" font-weight="600">Hacktoberfest</text>
  <text class="t" x="16" y="96" fill="#e8eefc" font-size="13" font-weight="600">Super Contributor</text>
  <text class="m" x="16" y="118" fill="#5b6b8c" font-size="9">VERIFIED  ·  ACTIVE</text>
  <circle cx="228" cy="20" r="5" fill="#f59e0b" class="pulse" opacity="0.7"/>
</g>

<!-- ACHIEVEMENT 2 — INTERN -->
<g transform="translate(290 78)">
  <rect width="248" height="130" rx="10" fill="#0c1628" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1"/>
  <rect width="248" height="3" rx="1.5" fill="url(#gCyan)" opacity="0.6"/>
  <!-- Briefcase icon -->
  <g transform="translate(16, 24)">
    <rect x="2" y="4" width="22" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.8"/>
    <path d="M8 4 L8 2 Q8 0 10 0 L16 0 Q18 0 18 2 L18 4" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
    <line x1="2" y1="12" x2="24" y2="12" stroke="#22d3ee" stroke-width="0.6" opacity="0.3"/>
  </g>
  <text class="m" x="46" y="40" fill="#22d3ee" font-size="9" letter-spacing="1.6">EXPERIENCE</text>
  <text class="t" x="16" y="76" fill="#e8eefc" font-size="13" font-weight="600">Intern</text>
  <text class="t" x="16" y="96" fill="#e8eefc" font-size="13" font-weight="600">Azmth Lab Pvt Ltd</text>
  <text class="m" x="16" y="118" fill="#5b6b8c" font-size="9">VERIFIED  ·  ACTIVE</text>
  <circle cx="228" cy="20" r="5" fill="#22d3ee" class="pulse" opacity="0.7"/>
</g>

<!-- ACHIEVEMENT 3 — HACKATHON -->
<g transform="translate(552 78)">
  <rect width="248" height="130" rx="10" fill="#0c1628" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
  <rect width="248" height="3" rx="1.5" fill="url(#gPurple)" opacity="0.6"/>
  <!-- Medal icon -->
  <g transform="translate(16, 24)">
    <circle cx="13" cy="10" r="8" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.8"/>
    <text class="m" x="13" y="14" text-anchor="middle" fill="#8b5cf6" font-size="9" font-weight="700" opacity="0.7">★</text>
    <path d="M8 18 L6 24 L13 20 L20 24 L18 18" fill="none" stroke="#8b5cf6" stroke-width="0.8" opacity="0.5"/>
  </g>
  <text class="m" x="46" y="40" fill="#8b5cf6" font-size="9" letter-spacing="1.6">HACKATHON</text>
  <text class="t" x="16" y="76" fill="#e8eefc" font-size="13" font-weight="600">Finalist</text>
  <text class="t" x="16" y="96" fill="#e8eefc" font-size="13" font-weight="600">HackOnIt</text>
  <text class="m" x="16" y="118" fill="#5b6b8c" font-size="9">VERIFIED  ·  EARNED</text>
  <circle cx="228" cy="20" r="5" fill="#8b5cf6" class="pulse" opacity="0.7"/>
</g>

<!-- ACHIEVEMENT 4 — TECHEXPO -->
<g transform="translate(814 78)">
  <rect width="258" height="130" rx="10" fill="#0c1628" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <rect width="258" height="3" rx="1.5" fill="url(#gGreen)" opacity="0.6"/>
  <!-- Award icon -->
  <g transform="translate(16, 24)">
    <polygon points="13,0 16,8 24,8 18,14 20,22 13,18 6,22 8,14 2,8 10,8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  </g>
  <text class="m" x="46" y="40" fill="#10b981" font-size="9" letter-spacing="1.6">AWARD</text>
  <text class="t" x="16" y="76" fill="#e8eefc" font-size="13" font-weight="600">Best Innovative Award</text>
  <text class="t" x="16" y="96" fill="#e8eefc" font-size="13" font-weight="600">TechExpo</text>
  <text class="m" x="16" y="118" fill="#5b6b8c" font-size="9">VERIFIED  ·  EARNED</text>
  <circle cx="238" cy="20" r="5" fill="#10b981" class="pulse" opacity="0.7"/>
</g>

</svg>
