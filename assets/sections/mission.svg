<circle class="tw" cx="863" cy="101" r="1.28" fill="#60a5fa" opacity="0.45" style="animation-delay:2.5200000000000005s"/>
<circle class="tw" cx="84" cy="36" r="0.40" fill="#22d3ee" opacity="0.55" style="animation-delay:2.8000000000000003s"/>
<circle class="tw" cx="13" cy="251" r="0.62" fill="#cfe8ff" opacity="0.65" style="animation-delay:0.0s"/>
<circle class="tw" cx="962" cy="218" r="0.84" fill="#60a5fa" opacity="0.75" style="animation-delay:0.28s"/>
<circle class="tw" cx="763" cy="257" r="1.06" fill="#cfe8ff" opacity="0.85" style="animation-delay:0.56s"/>
<circle class="tw" cx="712" cy="104" r="1.28" fill="#cfe8ff" opacity="0.25" style="animation-delay:0.8400000000000001s"/>
<circle class="tw" cx="825" cy="95" r="0.40" fill="#22d3ee" opacity="0.35" style="animation-delay:1.12s"/>
</g>
<text class="m" x="40" y="40" fill="#22d3ee" font-size="11" letter-spacing="3">MISSION CONTROL  ·  FOCUS CHANNELS</text>
<text class="t" x="40" y="72" fill="#e8eefc" font-size="22" font-weight="700">Current mission</text>
<text class="t" x="40" y="98" fill="#5b6b8c" font-size="12">Bars show relative focus, not measured skill. Edit widths in assets/sections/mission.svg</text>
<!-- EDIT: inner bar width max 210. Labels are focus, not skill %. -->
