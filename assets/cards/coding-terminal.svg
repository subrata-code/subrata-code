<line x1="0" y1="40" x2="720" y2="40" stroke="#1a2a48"/>
<text class="m" x="28" y="88" fill="#5b6b8c" font-size="14">$</text><text class="m" x="48" y="88" fill="#22d3ee" font-size="14">java solve.java</text><text class="m" x="28" y="124" fill="#5b6b8c" font-size="14">$</text><text class="m" x="48" y="124" fill="#60a5fa" font-size="14">git commit -m "orbit"</text><text class="m" x="28" y="160" fill="#5b6b8c" font-size="14">$</text><text class="m" x="48" y="160" fill="#8b5cf6" font-size="14">docker build -t universe .</text><text class="m" x="28" y="196" fill="#5b6b8c" font-size="14">$</text><text class="m" x="48" y="196" fill="#8b9cc8" font-size="14">npm run dev</text>
<text class="m" x="28" y="248" fill="#22d3ee" font-size="14">$ <tspan>█<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>

</svg>
