<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img">
<defs>
  <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070d"/>
    <stop offset="45%" stop-color="#0a1428"/>
    <stop offset="100%" stop-color="#0c1834"/>
  </linearGradient>
  <linearGradient id="gSkyLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e8f0ff"/>
    <stop offset="50%" stop-color="#d5e4fb"/>
    <stop offset="100%" stop-color="#c9d8f5"/>
  </linearGradient>
  <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#67e8f9"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
    <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="pGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22d3ee" stroke-width="0.45"/>
  </pattern>
</defs>
<style>
  .t { font-family: Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
  .pulse { animation: pulse 4s ease-in-out infinite; }
  .spin { animation: spin 28s linear infinite; transform-origin: center; }
  .spinr { animation: spinr 42s linear infinite; transform-origin: center; }
  .tw { animation: tw 3.2s ease-in-out infinite; }
  .scan { animation: scan 6s linear infinite; }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes pulse { 0%,100% { opacity:.7 } 50% { opacity:1 } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinr { to { transform: rotate(-360deg); } }
  @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @keyframes scan { 0% { transform: translateY(-20px); opacity:0 } 10% { opacity:.35 } 100% { transform: translateY(420px); opacity:0 } }
  @keyframes blink { 50% { opacity:0 } }
  
</style>

<rect width="520" height="220" rx="16" fill="#05070d"/>
<rect x="1" y="1" width="518" height="218" rx="15" fill="#0a1424" stroke="url(#gNeon)" stroke-width="1"/>
<text class="m" x="24" y="32" fill="#22d3ee" font-size="10" letter-spacing="2">FEATURED  ·  LIVE LOCATION</text>
<text class="t" x="24" y="64" fill="#e8eefc" font-size="22" font-weight="700">Rivo</text>
<text class="t" x="24" y="96" fill="#8b9cc8" font-size="13">Group riding with shared live location</text>
<text class="t" x="24" y="118" fill="#8b9cc8" font-size="13">and assistance alerts when a rider needs help.</text>
<rect x="24" y="148" width="472" height="48" rx="8" fill="#071018" stroke="#1a2a48"/>
<text class="m" x="40" y="178" fill="#5b6b8c" font-size="12">repo  ·  github.com/subrata-code/Rivo</text>
<circle cx="484" cy="36" r="6" fill="#22d3ee" class="pulse"/>

</svg>
